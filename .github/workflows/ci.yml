name: ci
on: [push, pull_request]

env:
  # Pinned: the apt version drifts with the runner image, and different
  # shellcheck releases emit different warnings (0.9.0 flags SC2120 where
  # 0.11.0 does not). Pinning is what makes a local run match CI.
  SHELLCHECK_VERSION: v0.11.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install -m755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck
        run: shellcheck -S warning hermes setup.sh uninstall.sh lib/*.sh tests/*.sh

      - name: syntax
        run: bash -n hermes setup.sh uninstall.sh lib/*.sh tests/*.sh

      # deliberately BEFORE gum is installed: this is the regression test for
      # hermes degrading gracefully when gum is missing
      - name: self-checks (no gum on PATH)
        run: ./tests/run.sh

      - name: smoke — dispatch works without a tty
        run: |
          go install github.com/charmbracelet/gum@latest
          export PATH="$HOME/go/bin:$PATH"
          HERMES_LIB=./lib ./hermes version
          HERMES_LIB=./lib ./hermes help
